<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>การแข่งขันทักษะ GOLD MEDAL ALL STAR SKILL CONTEST สำหรับช่างบริการ</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;600;700;800&family=Chakra+Petch:wght@600;700;800&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Sarabun', sans-serif;
    }

    body {
      background: url('bg.jpg') no-repeat center center fixed;
      background-size: cover;
      height: 100vh;
      width: 100vw;
      padding: 10px 16px;
      color: #1e293b;
      overflow: hidden;
      position: relative;
    }

    body::before {
      content: '';
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(10, 25, 50, 0.28);
      z-index: -1;
    }

    .dashboard-container {
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    /* Header Bar */
    .header-wrapper {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: rgba(255, 255, 255, 0.96);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      padding: 6px 20px;
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.85);
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.2);
      flex-shrink: 0;
    }

    .header-logo {
      width: 55px;
      height: 55px;
      object-fit: contain;
      border-radius: 6px;
    }

    .header-center {
      text-align: center;
      flex: 1;
      padding: 0 12px;
    }

    .title {
      font-size: 22px;
      font-weight: 800;
      color: #0f2b48;
      letter-spacing: 0.5px;
      margin-bottom: 3px;
    }

    .controls-bar {
      display: inline-flex;
      align-items: center;
      background: #0d2847;
      color: #fff;
      padding: 2px 14px;
      border-radius: 30px;
      box-shadow: 0 3px 10px rgba(0, 0, 0, 0.25);
      gap: 12px;
    }

    .round-selector {
      display: flex;
      align-items: center;
      font-size: 14px;
      font-weight: 800;
      font-family: 'Chakra Petch', sans-serif;
    }

    .round-selector select {
      background: #ffffff;
      color: #0d2847;
      border: none;
      font-size: 14px;
      font-weight: 800;
      font-family: 'Chakra Petch', sans-serif;
      padding: 1px 8px;
      border-radius: 10px;
      margin-left: 6px;
      cursor: pointer;
      outline: none;
    }

    .time-badge {
      font-size: 13.5px;
      font-weight: 700;
      font-family: 'Chakra Petch', sans-serif;
      background: rgba(255, 255, 255, 0.2);
      padding: 1px 10px;
      border-radius: 10px;
    }

    /* Grid 3 Columns x 2 Rows */
    .stations-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      grid-template-rows: repeat(2, 1fr);
      gap: 10px;
      flex: 1;
      min-height: 0;
    }

    /* Card */
    .card {
      background: rgba(255, 255, 255, 0.96);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.9);
      display: flex;
      padding: 6px 8px;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.12);
      overflow: hidden;
      height: 100%;
    }

    /* Sidebar ปรับให้แคบลงเหลือ 17% เพื่อประหยัดพื้นที่ */
    .card-sidebar {
      width: 17%;
      min-width: 78px;
      border-right: 1.5px solid #e2e8f0;
      padding-right: 4px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      flex-shrink: 0;
    }

    .station-icon-wrap {
      width: 36px;
      height: 36px;
      margin-bottom: 3px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .station-icon-wrap svg {
      width: 100%;
      height: 100%;
    }

    .station-name {
      font-size: 12px;
      font-weight: 800;
      color: #0f2b48;
      line-height: 1.35;
      margin-bottom: 5px;
      word-break: break-word;
    }

    .group-tag {
      color: #ffffff;
      font-size: 12.5px;
      font-weight: 800;
      padding: 3px 10px;
      border-radius: 14px;
      white-space: nowrap;
      box-shadow: 0 2px 6px rgba(0,0,0,0.2);
    }

    .group-tag.g-1 { background: linear-gradient(135deg, #1e3a8a, #0d2847); }
    .group-tag.g-2 { background: linear-gradient(135deg, #059669, #047857); }
    .group-tag.g-3 { background: linear-gradient(135deg, #ea580c, #c2410c); }
    .group-tag.g-4 { background: linear-gradient(135deg, #7c3aed, #5b21b6); }
    .group-tag.g-5 { background: linear-gradient(135deg, #0284c7, #0369a1); }
    .group-tag.g-6 { background: linear-gradient(135deg, #e11d48, #9f1239); }

    /* Content ฝั่งขวา ขยายเต็มที่ 83% */
    .card-content {
      width: 83%;
      padding-left: 6px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 2px;
      height: 100%;
    }

    .participant-row {
      display: flex;
      align-items: center;
      background: #ffffff;
      border: 1px solid #cbd5e1;
      padding: 0 6px;
      border-radius: 5px;
      gap: 6px;
      box-shadow: 0 1px 2px rgba(0,0,0,0.03);
      flex: 1;
      min-height: 25px;
    }

    .avatar-icon {
      width: 18px;
      height: 18px;
      background: #475569;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .avatar-icon svg {
      width: 11px;
      height: 11px;
      fill: #ffffff;
    }

    /* ขยายพื้นที่ชื่อให้มากที่สุด */
    .participant-info {
      flex: 1;
      display: flex;
      align-items: center;
      gap: 6px;
      overflow: hidden;
      min-width: 0;
    }

    .p-tag {
      font-family: 'Chakra Petch', sans-serif;
      font-size: 11px;
      font-weight: 800;
      padding: 1px 4px;
      border-radius: 3px;
      flex-shrink: 0;
    }

    .tag-cb { background: #e2e8f0; color: #1e293b; }
    .tag-me { background: #ffedd5; color: #c2410c; }

    .participant-name {
      font-size: 13.5px;
      font-weight: 700;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      color: #0f172a;
      flex: 1;
    }

    /* ปรับปุ่ม Status แบบ Mini Capsule กะทัดรัดมาก ไม่แย่งพื้นที่ชื่อ */
    .status-mini-group {
      display: flex;
      border-radius: 4px;
      overflow: hidden;
      border: 1px solid #cbd5e1;
      flex-shrink: 0;
      box-shadow: 0 1px 2px rgba(0,0,0,0.06);
    }

    .btn-status-mini {
      border: none;
      padding: 2px 8px;
      cursor: pointer;
      font-size: 10.5px;
      font-weight: 800;
      font-family: 'Sarabun', sans-serif;
      transition: all 0.15s ease;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      line-height: 1.2;
    }

    .btn-done {
      background: #16a34a;
      color: #ffffff;
    }

    .btn-pending {
      background: #dc2626;
      color: #ffffff;
    }

    .btn-status-mini.inactive {
      background: #f1f5f9;
      color: #94a3b8;
    }

    .btn-status-mini:not(.inactive):hover {
      filter: brightness(1.15);
    }
  </style>
</head>
<body>

  <div class="dashboard-container">
    <!-- Header -->
    <div class="header-wrapper">
      <img class="header-logo" src="Logo.jpg" alt="KUBOTA Logo Left">
      
      <div class="header-center">
        <h1 class="title">การแข่งขันทักษะ GOLD MEDAL ALL STAR SKILL CONTEST สำหรับช่างบริการ</h1>
        <div class="controls-bar">
          <div class="round-selector">
            <span>ROUND</span>
            <select id="roundSelect" onchange="changeRound(this.value)">
              <option value="1">1</option>
              <option value="2">2</option>
              <option value="3">3</option>
              <option value="4">4</option>
              <option value="5">5</option>
              <option value="6">6</option>
            </select>
          </div>
          <div class="time-badge" id="timeBadge">TIME: 09:00 - 09:40</div>
        </div>
      </div>

      <img class="header-logo" src="Logo.jpg" alt="KUBOTA Logo Right">
    </div>

    <!-- 6 Stations Grid -->
    <div class="stations-grid" id="stationsGrid"></div>
  </div>

  <script>
    const stationIcons = {
      1: `<svg viewBox="0 0 100 100">
            <circle cx="50" cy="50" r="38" fill="none" stroke="#3b82f6" stroke-width="10" stroke-dasharray="14 6"/>
            <circle cx="50" cy="50" r="28" fill="#ffffff" stroke="#1e293b" stroke-width="3"/>
            <path d="M42 62 L58 38 M38 42 L62 58" stroke="#eab308" stroke-width="6" stroke-linecap="round"/>
            <rect x="44" y="44" width="12" height="12" fill="#ef4444" rx="2"/>
          </svg>`,
      2: `<svg viewBox="0 0 100 100">
            <ellipse cx="50" cy="58" rx="22" ry="18" fill="#f8fafc" stroke="#1e293b" stroke-width="3"/>
            <ellipse cx="40" cy="30" rx="6" ry="16" fill="#f8fafc" stroke="#1e293b" stroke-width="3"/>
            <ellipse cx="60" cy="30" rx="6" ry="16" fill="#f8fafc" stroke="#1e293b" stroke-width="3"/>
            <path d="M30 46 C30 25 70 25 70 46" fill="none" stroke="#ef4444" stroke-width="5"/>
            <rect x="25" y="42" width="10" height="14" rx="3" fill="#1e293b"/>
            <rect x="65" y="42" width="10" height="14" rx="3" fill="#1e293b"/>
            <path d="M44 54 Q47 57 50 54 Q53 57 56 54" fill="none" stroke="#1e293b" stroke-width="2"/>
          </svg>`,
      3: `<svg viewBox="0 0 100 100">
            <circle cx="68" cy="24" r="7" fill="none" stroke="#1e3a5f" stroke-width="3"/>
            <path d="M60 48 L68 34 L78 34 L80 48" fill="none" stroke="#1e3a5f" stroke-width="3"/>
            <rect x="20" y="24" width="22" height="30" rx="2" fill="none" stroke="#ef4444" stroke-width="3"/>
            <line x1="26" y1="32" x2="36" y2="32" stroke="#ef4444" stroke-width="2"/>
            <line x1="26" y1="38" x2="36" y2="38" stroke="#ef4444" stroke-width="2"/>
            <line x1="26" y1="44" x2="36" y2="44" stroke="#ef4444" stroke-width="2"/>
            <path d="M16 62 L84 62 M30 62 L30 82 M70 62 L70 82" stroke="#ef4444" stroke-width="3"/>
          </svg>`,
      4: `<svg viewBox="0 0 100 100">
            <path d="M22 36 C22 24 38 24 38 36 L38 52 C38 64 22 64 22 52 Z" fill="none" stroke="#1e293b" stroke-width="4"/>
            <rect x="38" y="40" width="12" height="8" fill="#64748b"/>
            <rect x="50" y="38" width="16" height="12" fill="#cbd5e1" stroke="#1e293b" stroke-width="2"/>
            <rect x="66" y="36" width="18" height="16" rx="2" fill="#1e293b"/>
            <line x1="72" y1="36" x2="72" y2="52" stroke="#ffffff" stroke-width="1.5"/>
            <line x1="78" y1="36" x2="78" y2="52" stroke="#ffffff" stroke-width="1.5"/>
          </svg>`,
      5: `<svg viewBox="0 0 100 100">
            <circle cx="50" cy="50" r="4" fill="#0284c7"/>
            <rect x="42" y="16" width="16" height="12" fill="#bae6fd" stroke="#0284c7" stroke-width="2"/>
            <rect x="18" y="60" width="14" height="12" fill="#bae6fd" stroke="#0284c7" stroke-width="2"/>
            <rect x="68" y="60" width="14" height="12" fill="#bae6fd" stroke="#0284c7" stroke-width="2"/>
            <path d="M50 28 L50 46 M32 64 L46 54 M68 64 L54 54" stroke="#0284c7" stroke-width="3" stroke-linecap="round"/>
          </svg>`,
      6: `<svg viewBox="0 0 100 100">
            <rect x="18" y="18" width="64" height="64" rx="14" fill="none" stroke="#eab308" stroke-width="8"/>
            <path d="M34 50 L46 64 L74 30" fill="none" stroke="#eab308" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>`
    };

    const stations = [
      { id: 1, name: "ทดสอบแก้ไขปัญหา<br>(ที่ตัวรถจริง)" },
      { id: 2, name: "กลุ่มพัก<br>รอเข้าสอบ" },
      { id: 3, name: "สอบภาคความรู้" },
      { id: 4, name: "งานเครื่องมือวัด<br>(ชิ้นส่วน)" },
      { id: 5, name: "งานถอด-ประกอบ<br>(KIT)" },
      { id: 6, name: "งานตรวจเช็ก/<br>ปรับตั้งระบบ" }
    ];

    const groupsData = {
      1: [
        { type: "CB", name: "ชิดณรงค์ พงษ์สระพัง" },
        { type: "CB", name: "ทวิภพ สามขุนทด" },
        { type: "CB", name: "สุทธิวัฒน์ ลิไธสง" },
        { type: "CB", name: "อุนวัฒน์ น้อนสุข" },
        { type: "ME", name: "อภิชาติ ขาวเหมาะ" },
        { type: "ME", name: "นัชรูลเล๊าะ ดือเร๊ะ" },
        { type: "ME", name: "เกียรติศักดิ์ อารักษ์พุทธพงศ์" }
      ],
      2: [
        { type: "CB", name: "นัทธวัฒน์ ทึนรส" },
        { type: "CB", name: "สิทธิศักดิ์ วิเชียรศรี" },
        { type: "CB", name: "วัฒนา พุฒหยวก" },
        { type: "CB", name: "ปรีชา ดวงจันทร์" },
        { type: "ME", name: "สุรศักดิ์ มณีฉาย" },
        { type: "ME", name: "วรพัฒน์ โสกันทัต" },
        { type: "ME", name: "สมศักดิ์ วิเชียรทอง" }
      ],
      3: [
        { type: "CB", name: "สันติ ขวัญใจ" },
        { type: "CB", name: "วทัญญู ศรีกูลกิจ" },
        { type: "CB", name: "พีรกานต์ พันธุทุม" },
        { type: "CB", name: "พนมพร อุณาพรหม" },
        { type: "ME", name: "มุกต์นริน อนันตทวีกุล" },
        { type: "ME", name: "ธีรพล ชาวสวน" }
      ],
      4: [
        { type: "CB", name: "ทิพกร หมั่นสกุล" },
        { type: "CB", name: "ดัสกร เนาว์คศรีสอน" },
        { type: "CB", name: "ประทีป หยองใหญ่" },
        { type: "CB", name: "ณัฐพล สุดเนตร" },
        { type: "ME", name: "มนตรา น้อยคล้าย" },
        { type: "ME", name: "ศรายุทธ์ รัตนะ" }
      ],
      5: [
        { type: "CB", name: "อาทิตย์ บุญสอน" },
        { type: "CB", name: "ประมูล เสียงเพราะ" },
        { type: "CB", name: "ปัญญา อันโยธา" },
        { type: "CB", name: "กฤษฎา ซีชา" },
        { type: "ME", name: "สุทธิพงษ์ เต็งประเสริฐ" },
        { type: "ME", name: "อภิพัฒน์ รักพูนแก้ว" }
      ],
      6: [
        { type: "CB", name: "บัณฑิต พันธ์ศรี" },
        { type: "CB", name: "พรชัย มาลัยทอง" },
        { type: "CB", name: "สับรี ตาเฮ" },
        { type: "CB", name: "ประวิทย์ พรมเฮียง" },
        { type: "ME", name: "ชัชวาล เต็มเปี่ยม" },
        { type: "ME", name: "อาบาซ ตายงปากอ" },
        { type: "ME", name: "อนันต์ สวนจันทร์" }
      ]
    };

    const roundsSchedule = {
      1: { time: "09:00 - 09:40", mapping: [1, 2, 3, 4, 5, 6] },
      2: { time: "09:55 - 10:35", mapping: [6, 1, 2, 3, 4, 5] },
      3: { time: "10:50 - 11:30", mapping: [5, 6, 1, 2, 3, 4] },
      4: { time: "11:45 - 12:25", mapping: [4, 5, 6, 1, 2, 3] },
      5: { time: "13:35 - 14:15", mapping: [3, 4, 5, 6, 1, 2] },
      6: { time: "14:30 - 15:10", mapping: [2, 3, 4, 5, 6, 1] }
    };

    let currentRound = 1;
    let statusState = {};

    function renderBoard() {
      const schedule = roundsSchedule[currentRound];
      document.getElementById("timeBadge").innerText = `TIME: ${schedule.time}`;

      const grid = document.getElementById("stationsGrid");
      grid.innerHTML = "";

      stations.forEach((station, sIdx) => {
        const assignedGroupId = schedule.mapping[sIdx];
        const participants = groupsData[assignedGroupId] || [];

        const card = document.createElement("div");
        card.className = "card";

        let participantsHTML = "";
        participants.forEach((p, pIdx) => {
          const stateKey = `r${currentRound}_s${station.id}_p${pIdx}`;
          const currentStatus = statusState[stateKey] || "pending";

          participantsHTML += `
            <div class="participant-row">
              <div class="avatar-icon">
                <svg viewBox="0 0 24 24"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>
              </div>
              <div class="participant-info">
                <span class="p-tag tag-${p.type.toLowerCase()}">${p.type}</span>
                <span class="participant-name" title="${p.name}">${p.name}</span>
              </div>
              <div class="status-mini-group">
                <button class="btn-status-mini btn-done ${currentStatus === 'done' ? '' : 'inactive'}" onclick="setStatus('${stateKey}', 'done', this)">เสร็จ</button>
                <button class="btn-status-mini btn-pending ${currentStatus === 'pending' ? '' : 'inactive'}" onclick="setStatus('${stateKey}', 'pending', this)">รอ</button>
              </div>
            </div>
          `;
        });

        card.innerHTML = `
          <div class="card-sidebar">
            <div class="station-icon-wrap">
              ${stationIcons[station.id]}
            </div>
            <div class="station-name">${station.name}</div>
            <div class="group-tag g-${assignedGroupId}">กลุ่ม ${assignedGroupId}</div>
          </div>
          <div class="card-content">
            ${participantsHTML}
          </div>
        `;

        grid.appendChild(card);
      });
    }

    function changeRound(roundNum) {
      currentRound = parseInt(roundNum);
      renderBoard();
    }

    function setStatus(key, status, btn) {
      statusState[key] = status;
      const group = btn.parentElement;
      const doneBtn = group.querySelector(".btn-done");
      const pendingBtn = group.querySelector(".btn-pending");

      if (status === "done") {
        doneBtn.classList.remove("inactive");
        pendingBtn.classList.add("inactive");
      } else {
        pendingBtn.classList.remove("inactive");
        doneBtn.classList.add("inactive");
      }
    }

    renderBoard();
  </script>
</body>
</html>
